
apiVersion: kustomize.config.k8s.io/v1beta1

kind: Kustomization

namespace: dev

resources:

  - ../../base

  - migration-job.yaml

images:

  - name: nginx

    newTag: 1.25-alpine

replicas:

  - name: webapp

    count: 1

patches:

  - target:

      kind: ConfigMap

      name: webapp-config

    patch: |-

      - op: replace

        path: /data/APP_ENV

        value: "development"

      - op: add

        path: /metadata/annotations

        value:

          argocd.argoproj.io/sync-wave: "0"

  - target:

      kind: Deployment

      name: webapp

    patch: |-

      - op: add

        path: /metadata/annotations

        value:

          argocd.argoproj.io/sync-wave: "2"

