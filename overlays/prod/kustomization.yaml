
apiVersion: kustomize.config.k8s.io/v1beta1

kind: Kustomization

namespace: prod

resources:

  - ../../base

images:

  - name: nginx

    newTag: 1.27-alpine

replicas:

  - name: webapp

    count: 3

patches:

  - target:

      kind: ConfigMap

      name: webapp-config

    patch: |-

      - op: replace

        path: /data/APP_ENV

        value: "production"

